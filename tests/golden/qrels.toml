# Graded relevance judgments over the deterministic corpus built in
# src/search.rs::tests::ndcg_qrels (the corpus is code so the fixture and its
# judgments can never drift apart; the grades are human judgments).
#
# grade 2 = highly relevant, grade 1 = relevant; unlisted URLs are nonrelevant.
# floor = minimum acceptable NDCG@10. The baseline is 1.0 for every case:
# any ranking regression that swaps a graded pair or lets a nonrelevant doc
# outrank a graded one drops the case below its floor. The "dagger goblet"
# case is the title-boost canary: its grade-2 doc matches only via the title
# field, so removing the title boost flips the order and fails the test.

[[case]]
query = "rust ownership"
floor = 0.999
[case.grades]
"https://rust-book.example.com/ownership" = 2
"https://blog.example.dev/rust-ownership-notes" = 1

[[case]]
query = "mycelium networks"
floor = 0.999
[case.grades]
"https://fungi.example.org/networks" = 2
"https://blog.example.dev/mycelium-notes" = 1

